{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "polysite.serviceAccountName" . }}
  labels:
    {{- include "polysite.labels" (dict "ctx" . "component" "stack") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The pods never call the Kubernetes API, so no token is mounted into them (automountServiceAccountToken: false on every pod).
automountServiceAccountToken: false
{{- end }}
