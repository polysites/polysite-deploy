{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "polysite.fullname" . }}
  labels:
    {{- include "polysite.labels" (dict "ctx" . "component" "stack") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- include "polysite.secretData" . | nindent 2 }}
{{- if .Values.migrations.job.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "polysite.fullname" . }}-migrate
  labels:
    {{- include "polysite.labels" (dict "ctx" . "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: {{ ternary "post-install,pre-upgrade" "pre-install,pre-upgrade" .Values.postgresql.enabled }}
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  {{- include "polysite.secretData" . | nindent 2 }}
{{- end }}
{{- end }}
