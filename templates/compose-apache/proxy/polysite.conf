# Polysite behind Apache httpd (mod_proxy): the same routing, limits and headers as the Caddyfile, over plain HTTP.
#
# Debian / Ubuntu:   a2enmod proxy proxy_http headers rewrite
#                    cp polysite.conf /etc/apache2/sites-available/polysite.conf && a2ensite polysite
#                    apachectl configtest && systemctl reload apache2
# RHEL / the httpd image: LoadModule the same four modules, then Include this file.
# Behind something that already terminates TLS, use this file as it is; with TLS on this server use polysite-tls.conf.
#
# Edit three things:
#   1. the two Define lines (the stack's containers when Apache runs in the same Docker network, or 127.0.0.1:3001 and
#      127.0.0.1:3000 when it runs on the host and the compose file publishes those ports to loopback only);
#   2. ServerName in the two virtual hosts (SITE_DOMAIN and CMS_DOMAIN in .env), plus a ServerAlias per extra site domain:
#      every public site shares the first virtual host, the app picks the site from the Host header;
#   3. nothing else.
#
# What the Caddyfile does that this file reproduces:
#   /api/media/file/*   -> cms, API headers, Cache-Control public, max-age=86400
#   /api/form-intake/*  -> cms, API headers, request body capped at 64 KB (by rewrite rules: see "Request size limits" below)
#   /api/*              -> cms, API headers, request body capped at 100 MB (Caddy's 100MB is 100,000,000 bytes), chunked bodies refused
#   everything else     -> web (the Nuxt server also serves its own scripts, styles and fonts: no shared volume is needed)
#   admin domain        -> cms, admin headers (adds X-Frame-Options DENY and frame-ancestors 'none'), "/" redirects to /admin
# The app learns the client address from the LAST entry of X-Forwarded-For. mod_proxy appends the address Apache saw to
# whatever the client sent, so a forged header cannot hide the real one. Keep ports 3000 and 3001 off the public network.
# Live Preview and the admin use no websockets (Live Preview is an iframe with postMessage), so mod_proxy_wstunnel is not needed.

Define POLYSITE_CMS http://cms:3001
Define POLYSITE_WEB http://web:3000

# Not "Server: Apache/2.4.x (Ubuntu)". The word "Apache" stays: httpd cannot drop the header entirely.
ServerTokens Prod
ServerSignature Off

ProxyRequests Off
ProxyPreserveHost On
# Imports and large uploads can take a while; Caddy has no timeout at all.
ProxyTimeout 300
# Keep the path exactly as the browser sent it (a file name with a space or an encoded slash).
AllowEncodedSlashes NoDecode

# Anything that is not one of our domains (a scan of the server's address, a stray DNS record) gets nothing.
<VirtualHost *:80>
    ServerName unknown-host.invalid
    <Location "/">
        Require all denied
    </Location>
</VirtualHost>

# The public sites.
<VirtualHost *:80>
    ServerName site.example.org
    # ServerAlias second-site.example.net

    # Behind a TLS-terminating balancer, replace "http" with the header it sets, or set "https" here.
    RequestHeader set X-Forwarded-Proto "http"

    # Order matters: Location sections merge in the order they appear, so the narrow ones come after /api/.
    <Location "/api/">
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </Location>
    # Uploaded files never change under the same name, but the CMS sends no Cache-Control.
    <Location "/api/media/file/">
        Header always set Cache-Control "public, max-age=86400"
    </Location>
    # Request size limits. Apache's LimitRequestBody is NOT applied to a proxied request (tested: a 5 KB body passed a 1000-byte
    # limit), so the declared Content-Length is checked here instead, which stops every ordinary client. A body sent in chunks
    # declares no length and stock Apache cannot count it, so a chunked request body is refused outright with 411 (browsers never
    # send one for a form or an upload). If a client of yours streams uploads in chunks, delete the first rule and cap them with
    # a module that can (mod_security, SecRequestBodyLimit) or put nginx or Caddy in front.
    RewriteEngine On
    RewriteCond "%{HTTP:Transfer-Encoding}" "chunked" [NC]
    RewriteRule "^/api/" - [R=411,L]
    RewriteCond expr "%{HTTP:Content-Length} -gt 65536"
    RewriteRule "^/api/form-intake/" - [R=413,L]
    RewriteCond expr "%{HTTP:Content-Length} -gt 100000000"
    RewriteRule "^/api/" - [R=413,L]

    # Let's Encrypt's HTTP-01 challenge files (certbot --webroot), see polysite-tls.conf.
    ProxyPass "/.well-known/acme-challenge/" "!"
    Alias "/.well-known/acme-challenge/" "/var/www/certbot/.well-known/acme-challenge/"
    <Directory "/var/www/certbot/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    ProxyPass        "/api/" "${POLYSITE_CMS}/api/" nocanon
    ProxyPassReverse "/api/" "${POLYSITE_CMS}/api/"
    # Pages come with their own headers from the web app (CSP and the usual set), so none are added here.
    ProxyPass        "/" "${POLYSITE_WEB}/" nocanon
    ProxyPassReverse "/" "${POLYSITE_WEB}/"
</VirtualHost>

# The admin and the API on their own domain.
<VirtualHost *:80>
    ServerName admin.example.org

    RequestHeader set X-Forwarded-Proto "http"

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "frame-ancestors 'none'"

    # Request size limits: see the site virtual host above for why these are rewrite rules and not LimitRequestBody.
    RewriteEngine On
    RewriteCond "%{HTTP:Transfer-Encoding}" "chunked" [NC]
    RewriteRule "^" - [R=411,L]
    RewriteCond expr "%{HTTP:Content-Length} -gt 100000000"
    RewriteRule "^" - [R=413,L]

    # The bare root has no page of its own on this domain.
    RewriteRule "^/$" "/admin" [R=302,L]

    ProxyPass "/.well-known/acme-challenge/" "!"
    Alias "/.well-known/acme-challenge/" "/var/www/certbot/.well-known/acme-challenge/"
    <Directory "/var/www/certbot/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    ProxyPass        "/" "${POLYSITE_CMS}/" nocanon
    ProxyPassReverse "/" "${POLYSITE_CMS}/"
</VirtualHost>
