# Polysite on one server: Docker Compose, TRAEFIK for automatic HTTPS, PostgreSQL in a container, nightly backups.
# Everything is pinned to a release. Upgrade by changing the three version tags below (Dependabot or Renovate opens that pull request),
# then: docker compose pull && docker compose up -d
#
# Tested with Polysite core 0.1.x (see README.md). The registry default is the project's namespace; POLYSITE_REGISTRY in .env points
# at a mirror of your own. Needs Docker Compose 2.24 or newer.

name: polysite

services:
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443"]
    volumes:
      - ./proxy/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./proxy/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/acme
    depends_on: [web, cms]

  web:
    image: ${POLYSITE_REGISTRY:-ghcr.io/polysites}/polysite-web:v0.1.0
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    env_file: .env
    environment:
      NUXT_PUBLIC_CMS_SERVER_URL: ${CMS_SCHEME:-https}://${CMS_DOMAIN}
    depends_on: [cms]

  cms:
    image: ${POLYSITE_REGISTRY:-ghcr.io/polysites}/polysite-cms:v0.1.0
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    env_file: .env
    volumes:
      - media-data:/repo/apps/cms/media
    depends_on:
      db: {condition: service_healthy}

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backup:
    image: ${POLYSITE_REGISTRY:-ghcr.io/polysites}/polysite-backup:v0.1.0
    restart: unless-stopped
    env_file: .env
    volumes:
      - media-data:/media:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      db: {condition: service_healthy}

  # Not started by `up`: docker compose --profile restore run --rm restore latest --yes   (stop web and cms first)
  restore:
    profiles: ["restore"]
    image: ${POLYSITE_REGISTRY:-ghcr.io/polysites}/polysite-backup:v0.1.0
    entrypoint: ["/opt/backup/restore.sh"]
    env_file: .env
    volumes:
      - media-data:/media
      - ${BACKUP_HOST_DIR:-./backups}:/backups

volumes:
  traefik-acme:
  db-data:
  media-data:
