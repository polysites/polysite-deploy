# Polysite behind Apache httpd with https: the same routing, limits and headers as polysite.conf, with Apache terminating TLS.
#
#   a2enmod ssl http2 proxy proxy_http headers rewrite     (Debian / Ubuntu; "Protocols h2" needs mod_http2)
#
# Certificates: this file expects Let's Encrypt's layout (/etc/letsencrypt/live/<name>/). Get them first with the http-only
# polysite.conf in place:
#   certbot certonly --webroot -w /var/www/certbot -d site.example.org
#   certbot certonly --webroot -w /var/www/certbot -d admin.example.org
# (or let Apache do it itself with mod_md: MDomain, MDCertificateAgreement accepted; see the Apache docs, not tested here).
# Each domain needs its own certificate and virtual host; add one per extra site domain, or one certificate with several -d names.
# certbot renews them; reload Apache afterwards (certbot renew --deploy-hook "systemctl reload apache2").
# site.example.org and admin.example.org are placeholders: replace them everywhere. Set SITE_SCHEME=https and CMS_SCHEME=https in
# .env. Everything below the Define lines is polysite.conf unchanged except for the port, the ssl lines and X-Forwarded-Proto.
#
# Same edits and the same list of what is reproduced as in polysite.conf (read its header).

SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
SSLSessionTickets off

# Plain http: certificate challenges and a redirect to https, nothing else.
<VirtualHost *:80>
    ServerName site.example.org
    ServerAlias admin.example.org
    Alias "/.well-known/acme-challenge/" "/var/www/certbot/.well-known/acme-challenge/"
    <Directory "/var/www/certbot/.well-known/acme-challenge/">
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond "%{REQUEST_URI}" "!^/\.well-known/acme-challenge/"
    RewriteRule "^/?(.*)" "https://%{HTTP_HOST}/$1" [R=301,L]
</VirtualHost>

Define POLYSITE_CMS http://127.0.0.1:3001
Define POLYSITE_WEB http://127.0.0.1:3000

# Not "Server: Apache/2.4.x (Ubuntu)". The word "Apache" stays: httpd cannot drop the header entirely.
ServerTokens Prod
ServerSignature Off

ProxyRequests Off
ProxyPreserveHost On
# Imports and large uploads can take a while; Caddy has no timeout at all.
ProxyTimeout 300
# Keep the path exactly as the browser sent it (a file name with a space or an encoded slash).
AllowEncodedSlashes NoDecode


# The public sites.
<VirtualHost *:443>
    ServerName site.example.org
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/site.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/site.example.org/privkey.pem
    Protocols h2 http/1.1
    # ServerAlias second-site.example.net

    RequestHeader set X-Forwarded-Proto "https"

    # Order matters: Location sections merge in the order they appear, so the narrow ones come after /api/.
    <Location "/api/">
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </Location>
    # Uploaded files never change under the same name, but the CMS sends no Cache-Control.
    <Location "/api/media/file/">
        Header always set Cache-Control "public, max-age=86400"
    </Location>
    # Request size limits. Apache's LimitRequestBody is NOT applied to a proxied request (tested: a 5 KB body passed a 1000-byte
    # limit), so the declared Content-Length is checked here instead, which stops every ordinary client. A body sent in chunks
    # declares no length and stock Apache cannot count it, so a chunked request body is refused outright with 411 (browsers never
    # send one for a form or an upload). If a client of yours streams uploads in chunks, delete the first rule and cap them with
    # a module that can (mod_security, SecRequestBodyLimit) or put nginx or Caddy in front.
    RewriteEngine On
    RewriteCond "%{HTTP:Transfer-Encoding}" "chunked" [NC]
    RewriteRule "^/api/" - [R=411,L]
    RewriteCond expr "%{HTTP:Content-Length} -gt 65536"
    RewriteRule "^/api/form-intake/" - [R=413,L]
    RewriteCond expr "%{HTTP:Content-Length} -gt 100000000"
    RewriteRule "^/api/" - [R=413,L]

    ProxyPass        "/api/" "${POLYSITE_CMS}/api/" nocanon
    ProxyPassReverse "/api/" "${POLYSITE_CMS}/api/"
    # Pages come with their own headers from the web app (CSP and the usual set), so none are added here.
    ProxyPass        "/" "${POLYSITE_WEB}/" nocanon
    ProxyPassReverse "/" "${POLYSITE_WEB}/"
</VirtualHost>

# The admin and the API on their own domain.
<VirtualHost *:443>
    ServerName admin.example.org
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/admin.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/admin.example.org/privkey.pem
    Protocols h2 http/1.1

    RequestHeader set X-Forwarded-Proto "https"

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "frame-ancestors 'none'"

    # Request size limits: see the site virtual host above for why these are rewrite rules and not LimitRequestBody.
    RewriteEngine On
    RewriteCond "%{HTTP:Transfer-Encoding}" "chunked" [NC]
    RewriteRule "^" - [R=411,L]
    RewriteCond expr "%{HTTP:Content-Length} -gt 100000000"
    RewriteRule "^" - [R=413,L]

    # The bare root has no page of its own on this domain.
    RewriteRule "^/$" "/admin" [R=302,L]

    ProxyPass        "/" "${POLYSITE_CMS}/" nocanon
    ProxyPassReverse "/" "${POLYSITE_CMS}/"
</VirtualHost>
