# Polysite behind nginx: the same routing, limits and headers as the Caddyfile, over plain HTTP.
#
# Use this file as it is behind something that already terminates TLS (a load balancer, a CDN, another nginx), or as the
# starting point for certbot (`certbot --nginx -d site.example.org -d admin.example.org` adds the certificate lines), or
# swap it for polysite-tls.conf, which has the https server blocks written out. docs/guide/deploy/proxy.md walks through all three.
#
# Edit three things:
#   1. the two upstream addresses below (cms:3001 and web:3000 when nginx runs in the same Docker network as the stack;
#      127.0.0.1:3001 and 127.0.0.1:3000 when nginx runs on the host and the compose file publishes those ports to loopback);
#   2. server_name in the two server blocks (the public site domain or domains, and the admin domain: SITE_DOMAIN and
#      CMS_DOMAIN in .env);
#   3. nothing else. Which site a request belongs to is decided by the app from the Host header, so every site domain is
#      listed in the first server_name and shares one block.
#
# What the Caddyfile does that this file reproduces (and where):
#   - /api/media/file/*   -> cms, API headers, Cache-Control public, max-age=86400
#   - /api/form-intake/*  -> cms, API headers, request body capped at 64 KB (a chunked body declares no length, so nginx
#                            itself enforces the cap)
#   - /api/*              -> cms, API headers, request body capped at 100 MB (Caddy's 100MB is 100,000,000 bytes)
#   - everything else     -> web (the Nuxt server also serves its own scripts, styles and fonts, so no shared volume is needed)
#   - admin domain        -> cms, admin headers (adds X-Frame-Options DENY and frame-ancestors 'none'), "/" redirects to /admin
#   - the app learns the client address from the LAST entry of X-Forwarded-For; $proxy_add_x_forwarded_for appends the
#     address nginx saw, so a forged header cannot hide the real one. Keep ports 3000 and 3001 off the public network.
#
# Not reproducible with stock nginx: Caddy removes the "Server" header entirely; nginx can only hide its version
# (server_tokens off), the word "nginx" stays. Use a build with the headers-more module to remove it.

upstream polysite_cms {
    server cms:3001;
    keepalive 16;
}

upstream polysite_web {
    server web:3000;
    keepalive 16;
}

server_tokens off;

# Anything that is not one of our domains (a scan of the server's address, a stray DNS record) gets nothing.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# The public sites.
server {
    listen 80;
    server_name site.example.org;

    # Same for every proxied request.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    # Imports and large uploads can take a while; Caddy has no timeout at all.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Let's Encrypt's HTTP-01 challenge files (certbot --webroot), see polysite-tls.conf.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uploaded files never change under the same name, but the CMS sends no Cache-Control.
    location /api/media/file/ {
        client_max_body_size 100000000;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://polysite_cms;
    }

    # A visitor's form submission is tiny.
    location /api/form-intake/ {
        client_max_body_size 64k;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://polysite_cms;
    }

    location /api/ {
        client_max_body_size 100000000;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://polysite_cms;
    }

    # Pages come with their own headers from the web app (CSP and the usual set), so none are added here.
    location / {
        proxy_pass http://polysite_web;
    }
}

# The admin and the API on their own domain.
server {
    listen 80;
    server_name admin.example.org;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    client_max_body_size 100000000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # The bare root has no page of its own on this domain.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = / {
        return 302 /admin;
    }

    location / {
        proxy_pass http://polysite_cms;
    }
}
