# Polysite behind nginx with https: the same routing, limits and headers as polysite.conf, with nginx terminating TLS.
#
# Certificates: this file expects Let's Encrypt's layout (/etc/letsencrypt/live/<name>/). Get them first with the http-only
# polysite.conf in place plus the webroot location in the block below:
#   certbot certonly --webroot -w /var/www/certbot -d site.example.org
#   certbot certonly --webroot -w /var/www/certbot -d admin.example.org
# Each domain has its own certificate and server block (a wildcard certificate needs a DNS challenge and is not required);
# add one server block per extra site domain, or list them all in server_name with one certificate that has several -d names.
# certbot's timer renews the certificates; reload nginx afterwards (certbot renew --deploy-hook "systemctl reload nginx").
# site.example.org and admin.example.org are placeholders: replace them everywhere. Set SITE_SCHEME=https and CMS_SCHEME=https
# in .env. Everything below the first server block is polysite.conf unchanged except for the listen and ssl lines.
# "http2 on;" needs nginx 1.25.1 or newer. Ubuntu 24.04 ships 1.24: there, delete those lines and write "listen 443 ssl http2;" instead.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Plain http: certificate challenges and a redirect to https, nothing else.
server {
    listen 80;
    server_name site.example.org admin.example.org;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

upstream polysite_cms {
    server cms:3001;
    keepalive 16;
}

upstream polysite_web {
    server web:3000;
    keepalive 16;
}

server_tokens off;

# Anything that is not one of our domains (a scan of the server's address, a stray DNS record) gets nothing.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
    return 444;
}

# The public sites.
server {
    listen 443 ssl;
    http2 on;
    server_name site.example.org;
    ssl_certificate     /etc/letsencrypt/live/site.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site.example.org/privkey.pem;

    # Same for every proxied request.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    # Imports and large uploads can take a while; Caddy has no timeout at all.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Uploaded files never change under the same name, but the CMS sends no Cache-Control.
    location /api/media/file/ {
        client_max_body_size 100000000;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://polysite_cms;
    }

    # A visitor's form submission is tiny.
    location /api/form-intake/ {
        client_max_body_size 64k;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://polysite_cms;
    }

    location /api/ {
        client_max_body_size 100000000;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://polysite_cms;
    }

    # Pages come with their own headers from the web app (CSP and the usual set), so none are added here.
    location / {
        proxy_pass http://polysite_web;
    }
}

# The admin and the API on their own domain.
server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.org;
    ssl_certificate     /etc/letsencrypt/live/admin.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.org/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    client_max_body_size 100000000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # The bare root has no page of its own on this domain.
    location = / {
        return 302 /admin;
    }

    location / {
        proxy_pass http://polysite_cms;
    }
}
