name: Validate

# Only lints and validates; it deploys nothing and needs no secrets. Works once the chart is published to the registry.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Pull the pinned chart, lint it with your values, check the manifests against the Kubernetes schemas
        run: |
          VERSION=$(sed -n 's/^chartVersion: *//p' chart.yaml)
          docker run --rm -v "$PWD:/w" -w /w alpine/helm:3.17.3 pull oci://ghcr.io/polysites/charts/polysite --version "$VERSION" --destination /w
          docker run --rm -v "$PWD:/w" -w /w alpine/helm:3.17.3 lint "polysite-$VERSION.tgz" -f values.yaml
          docker run --rm -v "$PWD:/w" -w /w alpine/helm:3.17.3 template polysite "polysite-$VERSION.tgz" -f values.yaml > rendered.yaml
          docker run --rm -v "$PWD:/w" -w /w ghcr.io/yannh/kubeconform:latest-alpine -strict -summary -kubernetes-version 1.31.0 rendered.yaml
