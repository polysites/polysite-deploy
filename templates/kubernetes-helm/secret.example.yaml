# What the Secret named in values.yaml holds. DO NOT commit real values: create it with scripts/create-secret.sh, or manage it with
# External Secrets, Sealed Secrets or SOPS (an Argo CD / Flux deployment should never carry plain secrets in git).
apiVersion: v1
kind: Secret
metadata:
  name: polysite-secrets
  namespace: polysite
type: Opaque
stringData:
  PAYLOAD_SECRET: "generate with: openssl rand -base64 48 (never change it on a running install)"
  REVALIDATE_SECRET: "generate with: openssl rand -base64 48"
  POLYSITE_SETUP_TOKEN: "generate with: openssl rand -base64 32 (asked for on the first-run page)"
  DATABASE_URL: "postgres://user:password@host:5432/polysite?sslmode=require   (the user needs CREATEDB)"
