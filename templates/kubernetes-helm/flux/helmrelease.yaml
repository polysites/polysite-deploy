# Flux HelmRelease for Polysite. The values come from a ConfigMap generated from ../values.yaml:
#   kubectl -n polysite create configmap polysite-values --from-file=values.yaml=values.yaml --dry-run=client -o yaml | kubectl apply -f -
# Create the Secret out of band (scripts/create-secret.sh, or SOPS-encrypted in git). Not tested against a live Flux.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: polysite
  namespace: polysite
spec:
  interval: 10m
  chart:
    spec:
      chart: polysite
      # renovate: chart=ghcr.io/polysites/charts/polysite
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: polysite
  install:
    remediation: {retries: 1}
    timeout: 15m
  upgrade:
    remediation: {retries: 1, remediateLastFailure: true}
    timeout: 15m
  valuesFrom:
    - kind: ConfigMap
      name: polysite-values
      valuesKey: values.yaml
